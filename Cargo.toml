[package]
name = "mailcheck"
version = "0.1.0"
edition = "2021"

[dependencies]
imap = "2.4"
native-tls = "0.2"
rfc2047-decoder = "1"
tao = "0.34"
wry = "0.56"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls"] }
machine-uid = "0.5"
directories = "5"
sha2 = "0.10"
hex = "0.4"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
[profile.release]
opt-level = 2
